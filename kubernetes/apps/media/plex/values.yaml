app-template:
  controllers:
    plex:
      pod:
        nodeSelector:
          kubernetes.io/hostname: talos-wk01
      containers:
        app:
          image:
            repository: lscr.io/linuxserver/plex
            tag: latest@sha256:7f9a1d574958fc2f177c14ca190d4b811a58c274477f5bae8fb44ee676fb96bf
          env:
            TZ: Europe/Brussels
            PUID: "3001"
            PGID: "3001"
            VERSION: docker
            PLEX_CLAIM: ""
            # Networks considered "local" by Plex (no remote access restrictions)
            # Includes home network and Kubernetes internal pod/service networks
            ALLOWED_NETWORKS: "192.168.0.0/16,10.0.0.0/8"
            # Tell Plex the URL clients use to reach it (required for hostname recognition)
            ADVERTISE_IP: "http://plex.int.lorenzodebie.be:32400,http://192.168.40.62:32400"
          # talos-wk01 has 3950m CPU and 7.24Gi allocatable. The old request of
          # 2000m/4Gi reserved over half the node while steady-state usage is
          # ~4m/97Mi, and the old 8Gi limit exceeded what the node can give,
          # letting Plex push the node into memory pressure. Transcoding runs on
          # the iGPU, so the large CPU reservation bought nothing.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              memory: 6Gi
              gpu.intel.com/i915: 1
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
  
  service:
    app:
      controller: plex
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: "192.168.40.62"
      ports:
        http:
          port: 32400
  
  persistence:
    # Plex keeps its library in SQLite. Over NFS every lock is a network
    # round-trip to the HDD array that also serves the media library, which
    # stalls the server under scan/download load. This lives on the dedicated
    # SSD-backed disk on talos-wk01 instead (see kubernetes/core/local-path-provisioner).
    config:
      enabled: true
      type: persistentVolumeClaim
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 50Gi
    
    # Shared media volume (read-only for Plex)
    # Configure in Plex UI:
    #   TV Library: /media/media/tv
    #   Movies Library: /media/media/movies
    media:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media
      globalMounts:
        - path: /media
          readOnly: true
    
    transcode:
      enabled: true
      type: emptyDir
      globalMounts:
        - path: /transcode
