apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    # Pinned to the Gateway API version Cilium expects. Cilium v1.20 requires
    # the TLSRoute CRD and ReferenceGrant v1, both of which only reached the
    # standard channel in v1.6. On older CRDs the operator's Gateway API
    # controller refuses to start, which silently disables Gateway secret sync
    # and leaves the HTTPS listener without a certificate.
    targetRevision: v1.6.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # SSA required for Gateway API CRDs per official documentation
      - ServerSideApply=true
