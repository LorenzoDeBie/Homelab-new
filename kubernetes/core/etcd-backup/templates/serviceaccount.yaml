# Talos API access from pods. Talos (kubernetesTalosAPIAccess in
# talos/talconfig.yaml) turns this into a Secret of the same name holding a
# talosconfig. The role is limited to etcd backups, not os:admin.
# This namespace must be in allowedKubernetesNamespaces.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talos
  namespace: {{ .Release.Namespace }}
spec:
  roles:
    - os:etcd:backup
