# Daily etcd snapshot (spec BAK-1). See docs/maintenance.md, "etcd Backup".

schedule: "30 3 * * *"

# Newest snapshots to keep. One per day, so this is 14 days. Counted by
# number, not age, so a few failed days never delete the last good ones.
keep: 14

# Anything smaller than this is treated as a failed snapshot.
minSizeBytes: 102400

# Control plane address that apid dials for the snapshot (see talos/talconfig.yaml).
# Required: the talosconfig Talos generates for the ServiceAccount has endpoints
# but no nodes, and talosctl refuses to run without --nodes.
talosNode: 192.168.40.51

# Optional override for the API endpoint. Empty uses the talosconfig default.
talosEndpoint: ""

# Split into repository/tag so Renovate's helm-values manager tracks them.
# renovate.json5 stops talosctl and etcd from automerging: bump them by hand
# together with talosVersion in talos/talconfig.yaml and the etcd minor it ships.
images:
  talosctl:
    repository: ghcr.io/siderolabs/talosctl
    tag: v1.12.5
  etcdutl:
    repository: gcr.io/etcd-development/etcd
    tag: v3.6.15
  shell:
    repository: alpine
    tag: "3.22"
