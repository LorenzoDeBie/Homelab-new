# The GpuDevicePlugin CRD has no resources field: the operator creates this
# DaemonSet with a hard-coded 100m CPU limit, which throttles the plugin in
# bursts and trips CPUThrottlingHigh. The operator only reconciles image,
# init container, node selector, args and tolerations afterwards, so a partial
# server-side apply of the resources sticks.
#
# Prune/Delete are off: Argo CD must never delete the operator's DaemonSet.
# On a fresh cluster the DaemonSet may not exist yet when this is applied;
# the sync then fails and the Application's retry picks it up.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin-{{ index .Values "intel-device-plugins-gpu" "name" | default "gpudeviceplugin-sample" }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
spec:
  template:
    spec:
      containers:
        - name: intel-gpu-plugin
          resources:
            requests:
              cpu: 40m
              memory: 45Mi
            limits:
              cpu: 200m
              memory: 90Mi
